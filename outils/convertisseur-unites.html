    <div class="converter-container">
        <h1>Convertisseur d'Unités SI</h1>
        
        <div class="row">
            <div class="input-group">
                <label for="category">Catégorie</label>
                <select id="category"></select>
            </div>
            <div class="input-group">
                <label for="inputValue">Valeur à convertir</label>
                <input type="number" id="inputValue" value="1" step="any">
            </div>
        </div>
        
        <div class="row">
            <div class="input-group">
                <label for="fromUnit">De</label>
                <select id="fromUnit"></select>
            </div>
            <button id="swap-btn" class="action-btn" aria-label="Inverser les unités">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" /></svg>
            </button>
            <div class="input-group">
                <label for="toUnit">Vers</label>
                <select id="toUnit"></select>
            </div>
        </div>
        
        <div id="result"></div>

    </div>

    <script>
        // Le JavaScript est identique et n'a pas besoin d'être modifié.
        document.addEventListener('DOMContentLoaded', () => {
            const unitsByCategory = {
                'Masse': ['ng', 'µg', 'mg', 'g', 'kg', 't'],
                'Longueur': ['nm', 'µm', 'mm', 'cm', 'm', 'km'],
                'Volume': ['nL', 'µL', 'mL', 'L', 'm³'],
                'Température': ['C', 'K'],
                'Vitesse': ['m/s', 'km/h']
            };
            const conversionFactors = {
                Masse: { base: 'g', units: { 'ng': 1e-9, 'µg': 1e-6, 'mg': 1e-3, 'g': 1, 'kg': 1e3, 't': 1e6 } },
                Longueur: { base: 'm', units: { 'nm': 1e-9, 'µm': 1e-6, 'mm': 1e-3, 'cm': 1e-2, 'm': 1, 'km': 1e3 } },
                Volume: { base: 'L', units: { 'nL': 1e-9, 'µL': 1e-6, 'mL': 1e-3, 'L': 1, 'm³': 1e3 } },
                Vitesse: { base: 'm/s', units: { 'm/s': 1, 'km/h': 1 / 3.6 } }
            };

            function localConvert(value, from, to, category) {
                if (category === 'Température') {
                    if (from === to) return value; let tempInC;
                    if (from === 'C') tempInC = value; if (from === 'K') tempInC = value - 273.15;
                    if (to === 'C') return tempInC; if (to === 'K') return tempInC + 273.15;
                } else {
                    const categoryInfo = conversionFactors[category];
                    const valueInBase = value * categoryInfo.units[from];
                    return valueInBase / categoryInfo.units[to];
                }
            }

            const categorySelect = document.getElementById('category');
            const fromUnitSelect = document.getElementById('fromUnit');
            const toUnitSelect = document.getElementById('toUnit');
            const inputValue = document.getElementById('inputValue');
            const resultDiv = document.getElementById('result');
            const swapBtn = document.getElementById('swap-btn');
            
            function populateCategories() {
                Object.keys(unitsByCategory).forEach(category => {
                    const option = document.createElement('option');
                    option.value = option.textContent = category;
                    categorySelect.appendChild(option);
                });
            }

            function populateUnits() {
                const selectedCategory = categorySelect.value;
                const units = unitsByCategory[selectedCategory];
                fromUnitSelect.innerHTML = toUnitSelect.innerHTML = '';
                units.forEach(unit => {
                    const fromOption = document.createElement('option');
                    const toOption = document.createElement('option');
                    fromOption.value = toOption.value = unit;
                    fromOption.textContent = toOption.textContent = unit;
                    fromUnitSelect.appendChild(fromOption);
                    toUnitSelect.appendChild(toOption);
                });
                if (units.length > 2) { fromUnitSelect.value = units[2]; toUnitSelect.value = units[3];
                } else if (units.length > 1) { toUnitSelect.value = units[1]; }
                performConversion();
            }

            function performConversion() {
                const value = parseFloat(inputValue.value);
                const from = fromUnitSelect.value;
                const to = toUnitSelect.value;
                const category = categorySelect.value;
                if (isNaN(value)) {
                    resultDiv.textContent = '';
                    return;
                }
                try {
                    const result = localConvert(value, from, to, category);
                    let formattedResult;
                    if (Math.abs(result) >= 1e6 || (Math.abs(result) <= 1e-6 && result !== 0)) {
                        formattedResult = result.toExponential(4);
                    } else {
                        formattedResult = result.toLocaleString('fr-FR', { maximumFractionDigits: 9 });
                    }
                    resultDiv.textContent = `${value.toLocaleString('fr-FR')} ${from} = ${formattedResult} ${to}`;
                } catch (error) {
                    resultDiv.textContent = 'Conversion non possible.';
                    console.error(error);
                }
            }
            
            swapBtn.addEventListener('click', () => {
                const tempUnit = fromUnitSelect.value;
                fromUnitSelect.value = toUnitSelect.value;
                toUnitSelect.value = tempUnit;
                performConversion();
            });

            categorySelect.addEventListener('change', populateUnits);
            inputValue.addEventListener('input', performConversion);
            fromUnitSelect.addEventListener('change', performConversion);
            toUnitSelect.addEventListener('change', performConversion);

            populateCategories();
            populateUnits();
        });
    </script>
