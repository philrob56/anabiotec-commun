            margin-bottom: 1.5rem;

        h1 {
            color: var(--primary-accent);
            margin: 0 0 0.25rem 0;

            font-weight: 700;

        header p { margin: 0; color: var(--label-color); }

        .data-series-container {
            display: flex;

        .series-input { flex: 1; }

        label {
            display: block;

            color: var(--label-color);
        }

        select, input[type="number"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border-color);

            transition: all 0.2s ease-in-out;

        input[type="number"] { margin-bottom: 0.5rem; }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(22, 160, 133, 0.2);

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {

        input[type=number] { -moz-appearance: textfield; }

        footer { text-align: center; margin-top: 1.5rem; }

        #clear-button {
            background-image: linear-gradient(to right, #e52d27 0%, #b31217  51%, #e52d27  100%);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;

            font-weight: 500;
            background-size: 200% auto;

        #clear-button:hover {

    <div class="container">
        <header>
            <h1>Test t pour Séries Appariées</h1>
            <p>Comparaison de deux moyennes dépendantes</p>
        </header>
        <main>
            <div class="input-section">
                <label for="alpha">Niveau de risque (alpha) :</label>
                <select id="alpha">
                    <option value="0.05" selected>5%</option>
                    <option value="0.10">10%</option>
                </select>
            </div>
            
            <div class="data-series-container">
                <div class="series-input">
                    <label>Série 1 (ex: Avant)</label>
                    <div id="values-container-1">
                        <input type="number" placeholder="Valeur 1">
                    </div>
                </div>
                <div class="series-input">
                    <label>Série 2 (ex: Après)</label>
                    <div id="values-container-2">
                        <input type="number" placeholder="Valeur 2">
                    </div>
                </div>
            </div>

            <div class="results">
                <div id="result-summary" class="info">En attente de données...</div>
                <div class="result-details">
                    <p><span>t calculé :</span> <strong id="t-calculated">N/A</strong></p>
                    <p><span>t critique :</span> <strong id="t-critical">N/A</strong></p>
                    <p><span>Degrés de liberté (ddl) :</span> <strong id="df">N/A</strong></p>
                </div>
            </div>
        </main>
        <footer>
            <button id="clear-button">Effacer</button>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container1 = document.getElementById('values-container-1');
            const container2 = document.getElementById('values-container-2');
            const alphaSelect = document.getElementById('alpha');
            const resultSummary = document.getElementById('result-summary');
            const tCalculatedSpan = document.getElementById('t-calculated');
            const tCriticalSpan = document.getElementById('t-critical');
            const dfSpan = document.getElementById('df');
            const clearButton = document.getElementById('clear-button');

            const t_table = {'0.05':{1:12.71,2:4.30,3:3.18,4:2.78,5:2.57,6:2.45,7:2.36,8:2.31,9:2.26,10:2.23,11:2.20,12:2.18,13:2.16,14:2.14,15:2.13,16:2.12,17:2.11,18:2.10,19:2.09,20:2.09,25:2.06,30:2.04,40:2.02,60:2.00,120:1.98},'0.10':{1:6.31,2:2.92,3:2.35,4:2.13,5:2.02,6:1.94,7:1.89,8:1.86,9:1.83,10:1.81,11:1.80,12:1.78,13:1.77,14:1.76,15:1.75,16:1.75,17:1.74,18:1.73,19:1.73,20:1.72,25:1.71,30:1.70,40:1.68,60:1.67,120:1.66}};

            const addValueInputRow = (focusTargetContainer) => {
                if (container1.querySelectorAll('input').length < 100) {
                    const newInput1 = document.createElement('input');
                    newInput1.type = 'number';
                    newInput1.placeholder = 'Valeur 1';
                    container1.appendChild(newInput1);

                    const newInput2 = document.createElement('input');
                    newInput2.type = 'number';
                    newInput2.placeholder = 'Valeur 2';
                    container2.appendChild(newInput2);
                    
                    if (focusTargetContainer === container2) {
                        newInput2.focus();
                    } else {
                        newInput1.focus();
                    }
                }
            };

            const calculatePairedTTest = () => {
                const values1 = Array.from(container1.querySelectorAll('input')).map(i => parseFloat(i.value)).filter(v => !isNaN(v));
                const values2 = Array.from(container2.querySelectorAll('input')).map(i => parseFloat(i.value)).filter(v => !isNaN(v));

                if (values1.length !== values2.length || values1.length < 2) {
                    resultSummary.textContent = "Les séries doivent avoir le même nombre de valeurs (au moins 2 paires).";
                    resultSummary.className = 'info';
                    tCalculatedSpan.textContent = "N/A"; tCriticalSpan.textContent = "N/A"; dfSpan.textContent = "N/A";
                    return;
                }

                const n = values1.length;
                const differences = values1.map((val, index) => val - values2[index]);
                const mean_diff = differences.reduce((a, b) => a + b, 0) / n;
                const std_dev_diff = n > 1 ? Math.sqrt(differences.reduce((a, b) => a + (b - mean_diff)**2, 0) / (n - 1)) : 0;

                if (std_dev_diff === 0) {
                     resultSummary.textContent = "Toutes les différences sont nulles. Test non applicable.";
                     resultSummary.className = 'info';
                     tCalculatedSpan.textContent = "0.000"; tCriticalSpan.textContent = "N/A"; dfSpan.textContent = n - 1;
                     return;
                }
                
                const t_calc = mean_diff / (std_dev_diff / Math.sqrt(n));
                const df = n - 1;
                const alpha = alphaSelect.value;
                const t_crit_table = t_table[alpha];
                const df_key = Object.keys(t_crit_table).reverse().find(k => df >= k);
                const t_crit = df_key ? t_crit_table[df_key] : null;

                tCalculatedSpan.textContent = Math.abs(t_calc).toFixed(3);
                dfSpan.textContent = df;
                
                if (t_crit) {
                    tCriticalSpan.textContent = t_crit.toFixed(3);
                    if (Math.abs(t_calc) > t_crit) {
                        resultSummary.textContent = "Les moyennes sont significativement différentes.";
                        resultSummary.className = 'moyennes-differentes';
                    } else {
                        resultSummary.textContent = "Les moyennes ne sont pas significativement différentes.";
                        resultSummary.className = 'moyennes-egales';
                    }
                } else {
                     resultSummary.textContent = `t critique non disponible pour ddl=${df}`;
                     resultSummary.className = 'info';
                     tCriticalSpan.textContent = "N/A";
                }
            };
            
            const syncAndCalculate = () => {
                const inputs1 = container1.querySelectorAll('input');
                const inputs2 = container2.querySelectorAll('input');

                while (inputs1.length > inputs2.length) {
                     container2.appendChild(document.createElement('input')).type = 'number';
                }
                while (inputs2.length > inputs1.length) {
                    container1.appendChild(document.createElement('input')).type = 'number';
                }
                calculatePairedTTest();
            }

            container1.addEventListener('input', syncAndCalculate);
            container2.addEventListener('input', syncAndCalculate);
            alphaSelect.addEventListener('input', calculatePairedTTest);
            
            document.querySelector('.data-series-container').addEventListener('keydown', (e) => {
                if ((e.key !== 'ArrowDown' && e.key !== 'ArrowUp') || e.target.nodeName !== 'INPUT') {
                    return;
                }
                
                // CORRECTION: On prévient TOUJOURS le comportement par défaut pour les flèches
                e.preventDefault();

                const parentContainer = e.target.parentElement;
                const inputsInColumn = Array.from(parentContainer.querySelectorAll('input'));
                const currentIndex = inputsInColumn.indexOf(e.target);

                if (e.key === 'ArrowDown') {
                    if (currentIndex === inputsInColumn.length - 1) {
                        addValueInputRow(parentContainer);
                    } else {
                        inputsInColumn[currentIndex + 1].focus();
                    }
                } else if (e.key === 'ArrowUp') {
                     if (currentIndex > 0) {
                        inputsInColumn[currentIndex - 1].focus();
                    }
                }
            });
            
            clearButton.addEventListener('click', () => {
                container1.innerHTML = '<input type="number" placeholder="Valeur 1">';
                container2.innerHTML = '<input type="number" placeholder="Valeur 2">';
                container1.querySelector('input').focus();
                calculatePairedTTest();
            });

            calculatePairedTTest();
        });
    </script>

</body>
