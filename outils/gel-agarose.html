    <div class="container">
        <h1>Analyse par Électrophorèse sur Gel d'Agarose</h1>
        <div id="controles">
            <div class="control-group">
                <label>Tension : <span id="voltage-value" class="param-display">80</span> V</label>
                <input type="range" id="voltage-slider" min="20" max="150" value="80" step="5">
            </div>
            <div class="control-group">
                <label>Agarose : <span id="agarose-value" class="param-display">1.0</span> %</label>
                <input type="range" id="agarose-slider" min="0.5" max="2.5" value="1.0" step="0.1">
            </div>
            <div class="control-group">
                <label>Vitesse de simulation : <span id="speed-value" class="param-display">1</span>x</label>
                <input type="range" id="speed-slider" min="1" max="10" value="1" step="1">
            </div>
            <fieldset>
                <legend>Charger les puits</legend>
                <div id="samples-container"></div>
            </fieldset>
            <fieldset>
                <legend>Créer un échantillon personnalisé</legend>
                <p style="font-size: 0.9em; color: #555; margin: 0 0 10px 0;">Entrez les tailles des fragments en paires de bases (pb), séparées par des virgules.</p>
                <div id="custom-sample-controls">
                    <input type="text" id="custom-sample-input" placeholder="Ex: 500, 1500, 4000">
                    <button id="custom-sample-btn">Ajouter / Mettre à jour</button>
                </div>
            </fieldset>
            <div class="boutons-action">
                <button id="start-btn">Démarrer</button>
                <button id="pause-btn">Pause</button>
                <button id="reset-btn">Réinitialiser</button>
                <button id="graph-btn">Tracer la courbe d'étalonnage</button>
            </div>
        </div>
        <div class="results-wrapper">
            <div id="simulation-container">
                <canvas id="gel-canvas"></canvas>
                <div id="tooltip"></div>
            </div>
            <div id="graph-container">
                <canvas id="graph-canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ADN_SAMPLES = {
            'ladder': { name: 'Échelle 1kb (Ladder)', fragments: [10000, 8000, 6000, 5000, 4000, 3000, 2000, 1500, 1000, 750, 500, 250], intensites: [1, 1, 1, 1, 1, 2, 1, 1, 1, 1, 1, 1], color: '#333333' },
            'sampleA': { name: 'Produit de PCR A', fragments: [4500, 1200], color: '#d32f2f' },
            'sampleB': { name: 'Plasmide digéré B', fragments: [8000, 3000, 500], color: '#0e7c7b' },
            'sampleC': { name: 'Inconnu C', fragments: [2000], color: '#388e3c' },
            'sampleD': { name: 'Contamination D', fragments: [10000, 1500, 250], color: '#f57c00' },
            'sampleE': { name: 'Produit de PCR E', fragments: [600], color: '#5e35b1'},
            'degraded': { name: 'ADN Dégradé (Smear)', type: 'smear', fragments: [], color: '#4E342E' },
            'failed': { name: 'PCR Échouée (Vide)', fragments: [], color: '#BDBDBD' }
        };
        const voltageSlider = document.getElementById('voltage-slider'), voltageValue = document.getElementById('voltage-value');
        const agaroseSlider = document.getElementById('agarose-slider'), agaroseValue = document.getElementById('agarose-value');
        const speedSlider = document.getElementById('speed-slider'), speedValue = document.getElementById('speed-value');
        const samplesContainer = document.getElementById('samples-container');
        const startBtn = document.getElementById('start-btn'), pauseBtn = document.getElementById('pause-btn'), resetBtn = document.getElementById('reset-btn'), graphBtn = document.getElementById('graph-btn');
        const canvas = document.getElementById('gel-canvas'), ctx = canvas.getContext('2d');
        const graphCanvas = document.getElementById('graph-canvas'), gtx = graphCanvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        const customSampleInput = document.getElementById('custom-sample-input');
        const customSampleBtn = document.getElementById('custom-sample-btn');
        let simulationEnCours = false, estEnPause = false, tempsEcoule = 0, DUREE_SIMULATION_MAX = 5000, animationFrameId;
        const NOMBRE_PUITS = 8;
        let tempsFinal = DUREE_SIMULATION_MAX;
        let regressionParams = null;
        let positionsDesBandes = [];
        let graphDataPoints = [];
        
        function resizeCanvases() { [canvas, graphCanvas].forEach(c => { const rect = c.getBoundingClientRect(); c.width = rect.width; c.height = rect.height; }); }
        function genererSelecteursDePuits() {
            const selectionsActuelles = Array.from(samplesContainer.querySelectorAll('.well-selector')).map(s => s.value);
            samplesContainer.innerHTML = '';
            for (let i = 1; i <= NOMBRE_PUITS; i++) {
                const wellDiv = document.createElement('div'); wellDiv.className = 'well-control';
                const label = document.createElement('label'); label.htmlFor = `well-${i}`; label.textContent = `Puits ${i}`;
                const select = document.createElement('select'); select.id = `well-${i}`; select.className = 'well-selector';
                select.add(new Option('Vide', 'empty'));
                for (const [key, sample] of Object.entries(ADN_SAMPLES)) { select.add(new Option(sample.name, key)); }
                if (selectionsActuelles[i-1] && select.querySelector(`option[value="${selectionsActuelles[i-1]}"]`)) { select.value = selectionsActuelles[i-1]; } 
                else if (i === 1) { select.value = 'ladder'; }
                wellDiv.appendChild(label); wellDiv.appendChild(select); samplesContainer.appendChild(wellDiv);
            }
        }
        
        function dessinerGel(bandeSurlignee = null) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#eceff1"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
            ctx.fillStyle = '#333'; ctx.fillText('(-)', canvas.width / 2, 15);
            ctx.fillStyle = '#e53935'; ctx.fillText('(+)', canvas.width / 2, canvas.height - 5);
            const puitsWidth = 20, puitsHeight = 15;
            const puitsSpacing = (canvas.width - (NOMBRE_PUITS * puitsWidth)) / (NOMBRE_PUITS + 1);
            samplesContainer.querySelectorAll('.well-selector').forEach((select, i) => {
                const x = puitsSpacing * (i + 1) + puitsWidth * i;
                if (select.value !== 'empty' && ADN_SAMPLES[select.value]) {
                    ctx.fillStyle = ADN_SAMPLES[select.value].color;
                    ctx.globalAlpha = 0.8;
                    ctx.fillRect(x, 25, puitsWidth, puitsHeight);
                    ctx.globalAlpha = 1.0;
                }
                ctx.strokeStyle = '#546e7a';
                ctx.strokeRect(x, 25, puitsWidth, puitsHeight);
            });
            positionsDesBandes = [];
            samplesContainer.querySelectorAll('.well-selector').forEach((select, i) => {
                if(select.value === 'empty' || !ADN_SAMPLES[select.value]) return;
                const sample = ADN_SAMPLES[select.value];
                const centerX = puitsSpacing * (i + 1) + puitsWidth * i + (puitsWidth / 2);
                if (sample.type === 'smear') {
                    if (tempsEcoule > 0) {
                        const largeurSmear = puitsWidth * 1.5; const x = centerX - (largeurSmear / 2);
                        const startY = 45; const endY = 45 + calculerDistanceMigration(50, tempsEcoule);
                        const smearGradient = ctx.createLinearGradient(x, startY, x, endY);
                        const r = parseInt(sample.color.slice(1, 3), 16), g = parseInt(sample.color.slice(3, 5), 16), b = parseInt(sample.color.slice(5, 7), 16);
                        smearGradient.addColorStop(0, `rgba(${r},${g},${b},0.3)`);
                        smearGradient.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.fillStyle = smearGradient;
                        ctx.fillRect(x, startY, largeurSmear, endY - startY);
                    }
                } else if (sample.fragments && sample.fragments.length > 0) {
                    sample.fragments.forEach((taille, fragmentIndex) => {
                        const distance = calculerDistanceMigration(taille, tempsEcoule);
                        const y = 45 + distance;
                        if (y < canvas.height - 10) {
                            const largeurBande = puitsWidth * 1.5; const hauteurBande = 2 + (1 - (taille / 12000)) * 6; const x = centerX - (largeurBande / 2);
                            positionsDesBandes.push({ x, y, width: largeurBande, height: hauteurBande, distance, size: taille });
                            let intensite = (sample.intensites && sample.intensites[fragmentIndex]) ? sample.intensites[fragmentIndex] : 1.0;
                            const gradient = ctx.createLinearGradient(x, y, x, y + hauteurBande);
                            const baseAlpha = Math.max(0.4, 1 - (tempsEcoule / DUREE_SIMULATION_MAX)) * intensite;
                            const r = parseInt(sample.color.slice(1, 3), 16), g = parseInt(sample.color.slice(3, 5), 16), b = parseInt(sample.color.slice(5, 7), 16);
                            gradient.addColorStop(0, `rgba(${r},${g},${b}, 0)`);
                            gradient.addColorStop(0.5, `rgba(${r},${g},${b}, ${baseAlpha})`);
                            gradient.addColorStop(1, `rgba(${r},${g},${b}, 0)`);
                            ctx.fillStyle = gradient;
                            ctx.fillRect(x, y, largeurBande, hauteurBande);
                            const estSurlignee = bandeSurlignee && bandeSurlignee.size === taille;
                            if (estSurlignee) {
                                ctx.strokeStyle = '#FFFF00'; ctx.lineWidth = 2;
                                ctx.strokeRect(x, y, largeurBande, hauteurBande);
                                ctx.lineWidth = 1;
                            }
                        }
                    });
                }
                // MODIFICATION : Seul le Bleu de Bromophénol est dessiné
                if (tempsEcoule > 0 && select.value !== 'empty') {
                    const dye = { size: 300, color: '#0e7c7b', height: 2 }; // Bleu de Bromophénol
                    const distance = calculerDistanceMigration(dye.size, tempsEcoule);
                    const y = 45 + distance;
                    if (y < canvas.height - 10) {
                        const largeurBande = puitsWidth * 1.5;
                        const x = centerX - (largeurBande / 2);
                        ctx.fillStyle = dye.color;
                        ctx.globalAlpha = 0.7;
                        ctx.fillRect(x, y, largeurBande, dye.height);
                        ctx.globalAlpha = 1.0;
                    }
                }
            });
        }
        
        function calculerDistanceMigration(taille_pb, temps) {
            const voltage = parseFloat(voltageSlider.value), concentration = parseFloat(agaroseSlider.value);
            const mobilite = Math.log10(15000) - Math.log10(taille_pb), facteurGel = 1 / (concentration * 1.5), facteurVoltage = voltage / 100;
            return Math.max(0, mobilite * facteurGel * facteurVoltage * temps * 0.15);
        }

        function calculerRegressionLineaire(points) {
            const n = points.length; if (n < 2) return null;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            points.forEach(p => { sumX += p.distance; sumY += p.logSize; sumXY += p.distance * p.logSize; sumXX += p.distance * p.distance; });
            const m = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const c = (sumY - m * sumX) / n;
            let ssTot = 0, ssRes = 0; const meanY = sumY / n;
            points.forEach(p => { ssTot += (p.logSize - meanY) ** 2; const predictedY = m * p.distance + c; ssRes += (p.logSize - predictedY) ** 2; });
            return { m, c, r2: 1 - (ssRes / ssTot) };
        }
        
        function tracerCourbeEtalonnage(pointSurligne = null) {
            gtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
            regressionParams = null; graphDataPoints = [];
            const ladderLoaded = Array.from(document.querySelectorAll('.well-selector')).some(s => s.value === 'ladder');
            if (!ladderLoaded) {
                gtx.font = "16px sans-serif"; gtx.fillStyle = "red"; gtx.textAlign = "center";
                gtx.fillText("L'échelle (ladder) doit être chargée.", graphCanvas.width / 2, graphCanvas.height / 2);
                return;
            }
            const dataPoints = ADN_SAMPLES['ladder'].fragments.map(size => ({ size: size, logSize: Math.log10(size), distance: calculerDistanceMigration(size, tempsFinal) }));
            const padding = 50; const maxX = Math.max(...dataPoints.map(p => p.distance));
            const minLogY = Math.log10(100); const maxLogY = Math.log10(10000);
            const mapX = (dist) => padding + (dist / maxX) * (graphCanvas.width - padding * 2);
            const mapY = (logSize) => (graphCanvas.height - padding) - ((logSize - minLogY) / (maxLogY - minLogY)) * (graphCanvas.height - padding * 2);
            gtx.beginPath(); gtx.moveTo(padding, padding); gtx.lineTo(padding, graphCanvas.height - padding); gtx.lineTo(graphCanvas.width - padding, graphCanvas.height - padding);
            gtx.strokeStyle = '#333'; gtx.stroke();
            gtx.fillStyle = '#000'; gtx.textAlign = 'center'; gtx.fillText("Distance de migration (pixels)", graphCanvas.width / 2, graphCanvas.height - 15);
            gtx.save(); gtx.translate(15, graphCanvas.height / 2); gtx.rotate(-Math.PI / 2); gtx.fillText("log10(Taille en pb)", 0, 0); gtx.restore();
            for (let i = 1000; i <= 10000; i*=10) { gtx.fillText(i, padding - 25, mapY(Math.log10(i))); }
            gtx.fillText("100", padding - 25, mapY(Math.log10(100)));
            const regression = calculerRegressionLineaire(dataPoints);
            regressionParams = regression;
            if (regression) {
                gtx.beginPath(); const startY = regression.m * 0 + regression.c; const endY = regression.m * maxX + regression.c;
                gtx.moveTo(mapX(0), mapY(startY)); gtx.lineTo(mapX(maxX), mapY(endY));
                gtx.strokeStyle = 'blue'; gtx.lineWidth = 2; gtx.stroke(); gtx.lineWidth = 1;
                gtx.fillStyle = 'blue'; gtx.font = '12px sans-serif'; gtx.textAlign = 'right';
                gtx.fillText(`y = ${regression.m.toFixed(4)}x + ${regression.c.toFixed(4)}`, graphCanvas.width - padding, padding + 5);
                gtx.fillText(`R² = ${regression.r2.toFixed(4)}`, graphCanvas.width - padding, padding + 20);
            }
            dataPoints.forEach(p => {
                const x = mapX(p.distance); const y = mapY(p.logSize);
                graphDataPoints.push({ x, y, size: p.size });
                const estSurligne = pointSurligne && pointSurligne.size === p.size;
                gtx.beginPath(); gtx.arc(x, y, estSurligne ? 8 : 4, 0, Math.PI * 2);
                gtx.fillStyle = estSurligne ? '#FFFF00' : 'red'; gtx.fill();
                if (estSurligne) { gtx.strokeStyle = 'red'; gtx.stroke(); }
            });
        }
        
        function animer() {
            if (estEnPause) return;
            tempsEcoule += parseInt(speedSlider.value, 10);
            dessinerGel();
            let unFragmentEstSorti = false;
            const premierColorantDistance = calculerDistanceMigration(300, tempsEcoule);
            if (45 + premierColorantDistance >= canvas.height - 10) { unFragmentEstSorti = true; }
            const aDepasseLeTemps = tempsEcoule > DUREE_SIMULATION_MAX;
            if (unFragmentEstSorti || aDepasseLeTemps) {
                simulationEnCours = false; tempsFinal = tempsEcoule;
                startBtn.disabled = true; pauseBtn.disabled = true; pauseBtn.textContent = 'Pause'; graphBtn.disabled = false;
                canvas.style.cursor = 'pointer'; graphCanvas.style.cursor = 'pointer';
                return; 
            }
            animationFrameId = requestAnimationFrame(animer);
        }
        
        voltageSlider.addEventListener('input', () => { voltageValue.textContent = voltageSlider.value; });
        agaroseSlider.addEventListener('input', () => { agaroseValue.textContent = parseFloat(agaroseSlider.value).toFixed(1); });
        speedSlider.addEventListener('input', () => { speedValue.textContent = speedSlider.value; });
        startBtn.addEventListener('click', () => {
            simulationEnCours = true; estEnPause = false; tempsEcoule = 0; tempsFinal = DUREE_SIMULATION_MAX;
            startBtn.disabled = true; pauseBtn.disabled = false; resetBtn.disabled = false; graphBtn.disabled = true;
            [voltageSlider, agaroseSlider, speedSlider, customSampleInput, customSampleBtn].forEach(s => s.disabled = true);
            samplesContainer.querySelectorAll('select').forEach(s => s.disabled = true);
            gtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
            canvas.style.cursor = 'default'; graphCanvas.style.cursor = 'default'; tooltip.style.display = 'none';
            animer();
        });
        pauseBtn.addEventListener('click', () => {
            estEnPause = !estEnPause;
            if (estEnPause) { pauseBtn.textContent = 'Reprendre'; if (animationFrameId) cancelAnimationFrame(animationFrameId);
            } else { pauseBtn.textContent = 'Pause'; animer(); }
        });
        resetBtn.addEventListener('click', () => {
            simulationEnCours = false; estEnPause = false; if (animationFrameId) cancelAnimationFrame(animationFrameId);
            tempsEcoule = 0;
            startBtn.disabled = false; pauseBtn.disabled = true; pauseBtn.textContent = 'Pause'; resetBtn.disabled = true; graphBtn.disabled = true;
            [voltageSlider, agaroseSlider, speedSlider, customSampleInput, customSampleBtn].forEach(s => s.disabled = false);
            samplesContainer.querySelectorAll('select').forEach(s => s.disabled = false);
            dessinerGel();
            gtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
            canvas.style.cursor = 'default'; graphCanvas.style.cursor = 'default'; tooltip.style.display = 'none';
        });
        graphBtn.addEventListener('click', () => tracerCourbeEtalonnage(null));
        customSampleBtn.addEventListener('click', () => {
            const fragments = customSampleInput.value.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n) && n > 0);
            if (fragments.length > 0) {
                if (!ADN_SAMPLES['custom']) { ADN_SAMPLES['custom'] = { name: 'Échantillon Personnalisé', fragments: [], color: '#9C27B0' }; }
                ADN_SAMPLES['custom'].fragments = fragments.sort((a, b) => b - a);
                genererSelecteursDePuits();
                dessinerGel();
            }
        });
        canvas.addEventListener('mousemove', e => {
            if (simulationEnCours || !regressionParams) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
            let bandeSurvolee = null;
            for (const bande of positionsDesBandes) {
                if (mouseX >= bande.x && mouseX <= bande.x + bande.width && mouseY >= bande.y && mouseY <= bande.y + bande.height) {
                    bandeSurvolee = bande; break;
                }
            }
            if (bandeSurvolee) {
                const { m, c } = regressionParams;
                const tailleEstimee = Math.round(10 ** (m * bandeSurvolee.distance + c));
                tooltip.style.display = 'block'; tooltip.style.left = `${e.clientX - rect.left + 15}px`; tooltip.style.top = `${e.clientY - rect.top}px`;
                tooltip.textContent = `Taille estimée : ${tailleEstimee} pb`;
                dessinerGel(bandeSurvolee);
            } else { tooltip.style.display = 'none'; dessinerGel(null); }
        });
        canvas.addEventListener('mouseleave', () => { if (!simulationEnCours) { tooltip.style.display = 'none'; dessinerGel(null); } });
        graphCanvas.addEventListener('mousemove', e => {
            if (simulationEnCours || !regressionParams || graphDataPoints.length === 0) return;
            const rect = graphCanvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
            let pointSurvole = null;
            for (const point of graphDataPoints) {
                const dist = Math.sqrt((mouseX - point.x) ** 2 + (mouseY - point.y) ** 2);
                if (dist < 8) { pointSurvole = point; break; }
            }
            tracerCourbeEtalonnage(pointSurvole);
            const bandeAViser = pointSurvole ? positionsDesBandes.find(b => b.size === pointSurvole.size) : null;
            dessinerGel(bandeAViser);
        });
        graphCanvas.addEventListener('mouseleave', () => {
            if (!simulationEnCours) { tracerCourbeEtalonnage(null); dessinerGel(null); }
        });
        
        function initialisation() {
            resizeCanvases();
            genererSelecteursDePuits();
            dessinerGel();
            samplesContainer.addEventListener('change', () => { if (!simulationEnCours) dessinerGel(); });
            resetBtn.disabled = true; pauseBtn.disabled = true; graphBtn.disabled = true;
        }
        initialisation();
        window.addEventListener('resize', () => {
            resizeCanvases();
            dessinerGel();
            if(!graphBtn.disabled) { tracerCourbeEtalonnage(null); }
        });
    });
    </script>

</body>
