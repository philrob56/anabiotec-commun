    <div class="container">
        <h1>Calcul de Moyenne & IC</h1>

        <div class="form-group">
            <label for="data-input">Données (une par ligne) :</label>
            <textarea id="data-input" placeholder="Ex: 12.5&#10;11.8&#10;13.1"></textarea>
        </div>

        <div class="form-group">
            <label>Écart-type de la population (σ) :</label>
            <div class="radio-group">
                <label><input type="radio" name="stdDevType" value="unknown" checked> Inconnu (calculé)</label>
                <label><input type="radio" name="stdDevType" value="known"> Connu</label>
            </div>
        </div>

        <div class="form-group" id="known-std-dev-group">
            <input type="number" id="known-std-dev" step="any" placeholder="Entrez la valeur de σ">
        </div>

        <div class="form-group">
            <label for="confidence-level">Niveau de confiance (%) :</label>
            <select id="confidence-level">
                <option value="95" selected>95%</option>
                <option value="90">90%</option>
                <option value="99">99%</option>
                <option value="custom">Autre...</option>
            </select>
            <input type="number" id="confidence-level-custom" style="display:none; margin-top:8px;" min="1" max="99.99" step="0.1">
        </div>

        <button id="calculate-btn">Calculer</button>

        <div id="error-message" class="error"></div>
        
        <div id="results">
            <div class="result-header">
                <h3>Résultats :</h3>
                <p id="result-ci" class="main-result"></p>
            </div>
            <p id="result-n"></p>
            <p id="result-std-dev"></p>
            <p id="result-critical-value"></p>
            <p id="result-interpretation" class="interpretation"></p>
        </div>
    </div>

    <script>
        // --- Fonctions et Tableaux Statiques (minifié) ---
        const stats={sum:a=>a.reduce((c,d)=>c+d,0),mean:a=>stats.sum(a)/a.length,stdDevSample:a=>{const c=stats.mean(a);return Math.sqrt(stats.sum(a.map(d=>Math.pow(d-c,2)))/(a.length-1))},inverseNormal:a=>{const c=-39.6968302866538,d=220.946098424521,e=-275.928510446969,f=138.357751867269,g=-30.6647980661472,h=2.50662827745924,i=-54.4760987982241,j=161.585836858041,k=-155.698979859887,l=66.8013118877197,m=-13.2806815528857;let b,p;if(a<=0||a>=1)return NaN;return a<.5?(b=Math.sqrt(-2*Math.log(a)),p=(((((c*b+d)*b+e)*b+f)*b+g)*b+h)/(((((i*b+j)*b+k)*b+l)*b+m)*b+1)):(b=Math.sqrt(-2*Math.log(1-a)),p=-(((((c*b+d)*b+e)*b+f)*b+g)*b+h)/(((((i*b+j)*b+k)*b+l)*b+m)*b+1)),p}};
        const zTable={"90":1.645,"95":1.96,"99":2.576};
        const tTable={1:[6.314,12.706,63.657],2:[2.92,4.303,9.925],3:[2.353,3.182,5.841],4:[2.132,2.776,4.604],5:[2.015,2.571,4.032],6:[1.943,2.447,3.707],7:[1.895,2.365,3.499],8:[1.86,2.306,3.355],9:[1.833,2.262,3.25],10:[1.812,2.228,3.169],11:[1.796,2.201,3.106],12:[1.782,2.179,3.055],13:[1.771,2.16,3.012],14:[1.761,2.145,2.977],15:[1.753,2.131,2.947],16:[1.746,2.12,2.921],17:[1.74,2.11,2.898],18:[1.734,2.101,2.878],19:[1.729,2.093,2.861],20:[1.725,2.086,2.845],21:[1.721,2.08,2.831],22:[1.717,2.074,2.819],23:[1.714,2.069,2.807],24:[1.711,2.064,2.797],25:[1.708,2.06,2.787],26:[1.706,2.056,2.779],27:[1.703,2.052,2.771],28:[1.701,2.048,2.763],29:[1.699,2.045,2.756],30:[1.697,2.042,2.75]};
        const confidenceMapT={"90":0,"95":1,"99":2};
        
        // --- UI & Navigation Logic ---
        const dataInput=document.getElementById("data-input");dataInput.addEventListener("keydown",function(a){if("ArrowUp"!==a.key&&"ArrowDown"!==a.key)return;a.preventDefault();const{value:b,selectionStart:c}=this,d="ArrowUp"===a.key,e=b.lastIndexOf("\n",c-1)+1;if(d){if(0===e)return;const a=e-1,d=b.lastIndexOf("\n",a-1)+1;this.setSelectionRange(d,a)}else{let a=b.indexOf("\n",c);if(-1===a&&(a=b.length),a===b.length)return;const d=a+1;let e=b.indexOf("\n",d);-1===e&&(e=b.length),this.setSelectionRange(d,e)}});
        document.querySelector('input[name="stdDevType"][value="unknown"]').addEventListener("change",()=>document.getElementById("known-std-dev-group").style.display="none");document.querySelector('input[name="stdDevType"][value="known"]').addEventListener("change",()=>document.getElementById("known-std-dev-group").style.display="block");const confidenceSelect=document.getElementById("confidence-level"),confidenceCustom=document.getElementById("confidence-level-custom");confidenceSelect.addEventListener("change",()=>confidenceCustom.style.display="custom"===confidenceSelect.value?"block":"none");
        
        // --- Calculation Logic ---
        document.getElementById("calculate-btn").addEventListener("click",()=>{document.getElementById("results").style.display="none",document.getElementById("error-message").style.display="none";const a=document.getElementById("data-input").value.split("\n").map(b=>b.trim()).filter(b=>""!==b).map(b=>parseFloat(b.replace(",","."))).filter(b=>!isNaN(b));if(a.length<2)return void showError("Veuillez entrer au moins 2 valeurs numériques valides.");let b="custom"===confidenceSelect.value?parseFloat(confidenceCustom.value):parseFloat(confidenceSelect.value);if(isNaN(b)||b<=0||b>=100)return void showError("Le niveau de confiance doit être un nombre valide entre 0 et 100.");const c=a.length,d=stats.mean(a),e=1-b/100,f=document.querySelector('input[name="stdDevType"]:checked').value;let g,h,i,j,k;if("known"===f){const a=parseFloat(document.getElementById("known-std-dev").value);if(isNaN(a)||a<=0)return void showError("Veuillez entrer un écart-type connu (σ) positif et valide.");g=a,i="connu (σ)",k="Z",j=zTable[b.toString()],void 0===j&&(j=Math.abs(stats.inverseNormal(e/2)))}else{g=stats.stdDevSample(a),i="calculé (s)",k="t";const d=c-1;if(d>30)j=Math.abs(stats.inverseNormal(e/2));else{const a=confidenceMapT[b.toString()];if(void 0===a)return void showError("Pour un petit échantillon (n≤31), veuillez utiliser un niveau de confiance standard (90, 95, ou 99%).");j=tTable[d][a]}}if(isNaN(j))return void showError("Impossible de déterminer la valeur critique. Vérifiez les entrées.");h=j*g/Math.sqrt(c),displayResults({n:c,mean:d,stdDev:g,stdDevSource:i,confidenceLevel:b,marginOfError:h,criticalValue:j,criticalValueType:k})});
        function showError(a){const b=document.getElementById("error-message");b.textContent=a,b.style.display="block"}
        function displayResults(a){const b=a.mean-a.marginOfError,c=a.mean+a.marginOfError;document.getElementById("result-ci").innerHTML=`${a.mean.toFixed(4)} &pm; ${a.marginOfError.toFixed(4)}`,document.getElementById("result-n").textContent=`Taille de l'échantillon (n) : ${a.n}`,document.getElementById("result-std-dev").textContent=`Écart-type ${a.stdDevSource} : ${a.stdDev.toFixed(4)}`,document.getElementById("result-critical-value").textContent=`Valeur critique (${a.criticalValueType}) utilisée : ${a.criticalValue.toFixed(3)}`,document.getElementById("result-interpretation").textContent=`Interprétation : La vraie moyenne se situe dans l'intervalle [${b.toFixed(4)} ; ${c.toFixed(4)}] avec une confiance de ${a.confidenceLevel}%.`,document.getElementById("results").style.display="block"};
