    <div class="theme-switch" onclick="toggleTheme()" title="Changer le thème">
        🌙

    <div class="container">
        <h1>Calculateur de Masse Molaire</h1>
        
        <div class="input-group">
            <input type="text" id="formula" placeholder="Entrez la formule moléculaire (ex: CuSO4,5H2O)" 
                   autocomplete="off" spellcheck="false"/>
        </div>
        
        <button onclick="calculateMolarMass()">Calculer</button>
        
        <div id="result"></div>
    </div>

    <script>
        const atomicMasses = {
            H: 1.008,
            He: 4.003,
            Li: 6.941,
            Be: 9.012,
            B: 10.811,
            C: 12.011,
            N: 14.007,
            O: 15.999,
            F: 18.998,
            Ne: 20.180,
            Na: 22.990,
            Mg: 24.305,
            Al: 26.982,
            Si: 28.086,
            P: 30.974,
            S: 32.065,
            Cl: 35.453,
            K: 39.098,
            Ca: 40.078,
            Fe: 55.845,
            Cu: 63.546,
            Zn: 65.380,
            Br: 79.904,
            I: 126.904,
	Ba: 137.327,
	Mn: 54.938,
	Co: 58.933,
	Ni: 58.6934,
	Cr:51.9961,
	Ag:107.8682,
	Mo: 95.95,
	Ti:47.867,
	Ce:140.116
		
        };

        function calculatePartMass(formula) {
            let result = 0;
            let element = '';
            let number = '';
            let i = 0;

            while (i < formula.length) {
                if (formula[i].match(/[A-Z]/)) {
                    if (element) {
                        if (!atomicMasses[element]) {
                            throw new Error(`Élément inconnu : ${element}`);
                        }
                        result += atomicMasses[element] * (number ? parseInt(number) : 1);
                        number = '';
                    }
                    element = formula[i];
                    if (i + 1 < formula.length && formula[i + 1].match(/[a-z]/)) {
                        element += formula[i + 1];
                        i++;
                    }
                } else if (formula[i].match(/[0-9]/)) {
                    number += formula[i];
                } else if (formula[i] !== ' ') {
                    throw new Error("Caractère invalide dans la formule");
                }
                i++;
            }
            
            if (element) {
                if (!atomicMasses[element]) {
                    throw new Error(`Élément inconnu : ${element}`);
                }
                result += atomicMasses[element] * (number ? parseInt(number) : 1);
            }

            return result;
        }

        function calculateMolarMass() {
            const formulaInput = document.getElementById('formula').value.trim();
            const resultDiv = document.getElementById('result');
            
            try {
                if (!formulaInput) {
                    throw new Error("Veuillez entrer une formule moléculaire");
                }

                const parts = formulaInput.split(',');
                let totalMass = calculatePartMass(parts[0]);

                if (parts.length > 1) {
                    for (let i = 1; i < parts.length; i++) {
                        let part = parts[i].trim();
                        let multiplier = 1;
                        
                        const multiplierMatch = part.match(/^(\d+(\.\d+)?)/);
                        if (multiplierMatch) {
                            multiplier = parseFloat(multiplierMatch[1]);
                            part = part.substring(multiplierMatch[0].length);
                        }
                        
                        totalMass += multiplier * calculatePartMass(part);
                    }
                }

                resultDiv.innerHTML = `
                    <div class="formula">${formulaInput}</div>
                    <div class="result-value">${totalMass.toFixed(3)} g/mol</div>
                `;
                resultDiv.className = '';

                // Animation du résultat
                resultDiv.style.opacity = '0';
                setTimeout(() => {
                    resultDiv.style.opacity = '1';
                }, 50);

            } catch (error) {
                resultDiv.innerHTML = error.message;
                resultDiv.className = 'error';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themeSwitch = document.querySelector('.theme-switch');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                themeSwitch.textContent = '🌙';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeSwitch.textContent = '☀️';
            }
        }

        document.getElementById('formula').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateMolarMass();
            }
        });
    </script>
