    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

            --error-color: #c0392b;
            --info-color: #0a5c5b;

            --outlier-border: #e57373;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);

            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        .container {
            background: var(--container-bg);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: var(--primary-accent);
            margin: 0 0 0.25rem 0;
            font-size: 1.75rem;
            font-weight: 700;
        }
        
        header p {
            margin: 0;
            color: var(--label-color);
        }

        .input-section {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--label-color);
        }

        select, input[type="number"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fdfdfd;
            transition: all 0.2s ease-in-out;
        }
        
        input[type="number"] {
            margin-bottom: 0.5rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none; margin: 0;

        input[type=number] { -moz-appearance: textfield; }

        .results {

<body>

    <div class="container">
        <header>
            <h1>Test de Dixon</h1>
            <p>Valeurs aberrantes (N=3 à 20)</p>
        </header>
        <main>
            <div class="input-section">
                <label for="alpha">Niveau de risque :</label>
                <select id="alpha">
                    <option value="0.05">5%</option>
                    <option value="0.10" selected>10%</option>
                </select>
            </div>
            <label>Valeurs (Flèche bas pour ajouter) :</label>
            <div id="values-container">
                <input type="number" placeholder="Entrez une valeur">
            </div>
            <div class="results">
                <div id="result-summary" class="info">En attente de données...</div>
                <div class="result-details">
                    <p><span>Q calculée :</span> <strong id="q-calculated">N/A</strong></p>
                    <p><span>Q critique :</span> <strong id="q-critical">N/A</strong></p>
                </div>
            </div>
        </main>
        <footer>
            <button id="clear-button">Effacer</button>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const valuesContainer = document.getElementById('values-container');
            const alphaSelect = document.getElementById('alpha');
            const resultSummary = document.getElementById('result-summary');
            const qCalculatedSpan = document.getElementById('q-calculated');
            const qCriticalSpan = document.getElementById('q-critical');
            const clearButton = document.getElementById('clear-button');

            const qCriticalValues = {
                '0.05': {3: 0.970, 4: 0.829, 5: 0.710, 6: 0.625, 7: 0.568, 8: 0.608, 9: 0.564, 10: 0.530, 11: 0.502, 12: 0.479, 13: 0.460, 14: 0.444, 15: 0.430, 16: 0.418, 17: 0.408, 18: 0.399, 19: 0.391, 20: 0.384},
                '0.10': {3: 0.941, 4: 0.765, 5: 0.642, 6: 0.560, 7: 0.507, 8: 0.554, 9: 0.512, 10: 0.477, 11: 0.450, 12: 0.428, 13: 0.410, 14: 0.395, 15: 0.382, 16: 0.371, 17: 0.361, 18: 0.352, 19: 0.344, 20: 0.337}
            };
            
            const addValueInput = () => {
                if (valuesContainer.querySelectorAll('input').length < 20) {
                    const newInput = document.createElement('input');
                    newInput.type = 'number';
                    newInput.placeholder = 'Entrez une valeur';
                    valuesContainer.appendChild(newInput);
                    newInput.focus();
                }
            };

            const calculateDixonTest = () => {
                const inputs = Array.from(valuesContainer.querySelectorAll('input'));
                inputs.forEach(input => input.classList.remove('is-outlier'));
                
                const values = inputs.map(input => ({ val: parseFloat(input.value), inputEl: input }))
                                      .filter(item => !isNaN(item.val) && item.val !== null);

                if (values.length < 3) {
                    resultSummary.textContent = "Le test nécessite au moins 3 valeurs.";
                    resultSummary.className = 'info';
                    qCalculatedSpan.textContent = "N/A";
                    qCriticalSpan.textContent = "N/A";
                    return;
                }
                
                if (values.length > 20) {
                    resultSummary.textContent = "Le test est limité à 20 valeurs.";
                    resultSummary.className = 'info';
                    qCalculatedSpan.textContent = "N/A";
                    qCriticalSpan.textContent = "N/A";
                    return;
                }

                values.sort((a, b) => a.val - b.val);
                const n = values.length;
                const alpha = alphaSelect.value;
                const x = i => values[i].val;

                let suspectIsMin, suspectIsMax;
                if (n <= 7) {
                    suspectIsMin = (x(1) - x(0)) / (x(n - 1) - x(0));
                    suspectIsMax = (x(n - 1) - x(n - 2)) / (x(n - 1) - x(0));
                } else if (n <= 10) {
                    suspectIsMin = (x(1) - x(0)) / (x(n - 2) - x(0));
                    suspectIsMax = (x(n - 1) - x(n - 2)) / (x(n - 1) - x(1));
                } else if (n <= 13) {
                    suspectIsMin = (x(2) - x(0)) / (x(n - 2) - x(0));
                    suspectIsMax = (x(n - 1) - x(n - 3)) / (x(n - 1) - x(1));
                } else {
                    suspectIsMin = (x(2) - x(0)) / (x(n - 3) - x(0));
                    suspectIsMax = (x(n - 1) - x(n - 3)) / (x(n - 1) - x(2));
                }
                
                const qCalculated = Math.max(suspectIsMin, suspectIsMax);
                const qCritical = qCriticalValues[alpha][n];

                qCalculatedSpan.textContent = qCalculated.toFixed(3);
                qCriticalSpan.textContent = qCritical.toFixed(3);

                if (qCalculated > qCritical) {
                    resultSummary.textContent = "Valeur aberrante détectée !";
                    resultSummary.className = 'outlier';
                    
                    let outlierInput = (suspectIsMin > suspectIsMax) ? values[0].inputEl : values[n-1].inputEl;
                    outlierInput.classList.add('is-outlier');

                } else {
                    resultSummary.textContent = "Aucune valeur aberrante détectée.";
                    resultSummary.className = 'no-outlier';
                }
            };

            valuesContainer.addEventListener('input', calculateDixonTest);
            alphaSelect.addEventListener('change', calculateDixonTest);
            valuesContainer.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' && e.target.nodeName === 'INPUT') {
                    e.preventDefault();
                    addValueInput();
                }
            });
            
            clearButton.addEventListener('click', () => {
                valuesContainer.innerHTML = '<input type="number" placeholder="Entrez une valeur">';
                valuesContainer.querySelector('input').focus();
                calculateDixonTest();
            });

            calculateDixonTest();
        });
    </script>

</body>
