    <style>

    <div class="container">
        <header>
            <h1>Test de Grubbs</h1>
            <p>Valeurs aberrantes (N≥3)</p>
        </header>
        <main>
            <div class="input-section">
                <label for="alpha">Niveau de risque :</label>
                <select id="alpha">
                    <option value="0.05">5%</option>
                    <option value="0.10" selected>10%</option>
                </select>
            </div>
            <label>Valeurs (Flèche bas pour ajouter) :</label>
            <div id="values-container">
                <input type="number" placeholder="Entrez une valeur">
            </div>
            <div class="results">
                <div id="result-summary" class="info">En attente de données...</div>
                <div class="result-details">
                    <p><span>G calculé :</span> <strong id="g-calculated">N/A</strong></p>
                    <p><span>G critique :</span> <strong id="g-critical">N/A</strong></p>
                </div>
            </div>
        </main>
        <footer>
            <button id="clear-button">Effacer</button>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const valuesContainer = document.getElementById('values-container');
            const alphaSelect = document.getElementById('alpha');
            const resultSummary = document.getElementById('result-summary');
            const gCalculatedSpan = document.getElementById('g-calculated');
            const gCriticalSpan = document.getElementById('g-critical');
            const clearButton = document.getElementById('clear-button');

            // Table des valeurs critiques de Grubbs (G) pour un test bilatéral. [2]
            const gCriticalValues = {
                '0.05': {3: 1.155, 4: 1.481, 5: 1.715, 6: 1.887, 7: 2.020, 8: 2.126, 9: 2.215, 10: 2.290, 11: 2.355, 12: 2.412, 13: 2.462, 14: 2.507, 15: 2.549, 16: 2.585, 17: 2.620, 18: 2.651, 19: 2.681, 20: 2.709},
                '0.10': {3: 1.153, 4: 1.463, 5: 1.672, 6: 1.822, 7: 1.938, 8: 2.032, 9: 2.110, 10: 2.176, 11: 2.234, 12: 2.285, 13: 2.331, 14: 2.371, 15: 2.409, 16: 2.443, 17: 2.475, 18: 2.504, 19: 2.532, 20: 2.557}
            };
            
            const addValueInput = () => {
                if (valuesContainer.querySelectorAll('input').length < 20) {
                    const newInput = document.createElement('input');
                    newInput.type = 'number';
                    newInput.placeholder = 'Entrez une valeur';
                    valuesContainer.appendChild(newInput);
                    newInput.focus();
                }
            };

            const calculateGrubbsTest = () => {
                const inputs = Array.from(valuesContainer.querySelectorAll('input'));
                inputs.forEach(input => input.classList.remove('is-outlier'));
                
                const data = inputs.map(input => ({ val: parseFloat(input.value), inputEl: input }))
                                      .filter(item => !isNaN(item.val) && item.val !== null);

                if (data.length < 3) {
                    resultSummary.textContent = "Le test nécessite au moins 3 valeurs.";
                    resultSummary.className = 'info';
                    gCalculatedSpan.textContent = "N/A";
                    gCriticalSpan.textContent = "N/A";
                    return;
                }
                
                const values = data.map(item => item.val);
                const n = values.length;
                const alpha = alphaSelect.value;

                // Calcul de la moyenne et de l'écart-type
                const mean = values.reduce((acc, val) => acc + val, 0) / n;
                const stdDev = Math.sqrt(values.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / (n - 1));

                if (stdDev === 0) {
                     resultSummary.textContent = "Écart-type nul, test impossible.";
                     resultSummary.className = 'info';
                     gCalculatedSpan.textContent = "N/A";
                     gCriticalSpan.textContent = "N/A";
                     return;
                }

                // Trouver la valeur la plus éloignée de la moyenne
                let maxDeviation = 0;
                let outlierCandidate;
                data.forEach(item => {
                    const deviation = Math.abs(item.val - mean);
                    if (deviation > maxDeviation) {
                        maxDeviation = deviation;
                        outlierCandidate = item;
                    }
                });

                const gCalculated = maxDeviation / stdDev;
                const gCritical = gCriticalValues[alpha][n] || gCriticalValues[alpha][20]; // Fallback pour n > 20

                gCalculatedSpan.textContent = gCalculated.toFixed(3);
                gCriticalSpan.textContent = gCritical.toFixed(3);

                if (gCalculated > gCritical) {
                    resultSummary.textContent = "Valeur aberrante détectée !";
                    resultSummary.className = 'outlier';
                    if(outlierCandidate) {
                       outlierCandidate.inputEl.classList.add('is-outlier');
                    }
                } else {
                    resultSummary.textContent = "Aucune valeur aberrante détectée.";
                    resultSummary.className = 'no-outlier';
                }
            };

            valuesContainer.addEventListener('input', calculateGrubbsTest);
            alphaSelect.addEventListener('change', calculateGrubbsTest);
            valuesContainer.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' && e.target.nodeName === 'INPUT') {
                    e.preventDefault();
                    addValueInput();
                }
            });
            
            clearButton.addEventListener('click', () => {
                valuesContainer.innerHTML = '<input type="number" placeholder="Entrez une valeur">';
                valuesContainer.querySelector('input').focus();
                calculateGrubbsTest();
            });

            calculateGrubbsTest();
        });
    </script>

</body>
