    <div class="container">
        <h1>Test d'Erreur Systématique</h1>

        <div class="form-row">
            <div class="form-group">
                <label for="true-value">Valeur Vraie (xv)</label>
                <input type="text" id="true-value" placeholder="Ex: 20.00">
            </div>
            <div class="form-group">
                <label for="confidence-level">Niveau de confiance</label>
                <select id="confidence-level">
                    <option value="90">90 %</option>
                    <option value="95" selected>95 %</option>
                    <option value="98">98 %</option>
                    <option value="99">99 %</option>
                    <option value="99.9">99.9 %</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="exp-values">Série Expérimentale (saisir ou coller)</label>
            <textarea id="exp-values" rows="8" placeholder="20.1&#10;20.3&#10;19.9&#10;..."></textarea>
        </div>

        <div class="button-group">
            <button class="primary" onclick="calculateAndDisplay()">Lancer le Test</button>
            <button class="reset" onclick="resetApp()">Réinitialiser</button>
        </div>

        <div id="results">
            <h2>Résultats du Test</h2>
            <div id="conclusion-banner"></div>
            <table>
                <tbody>
                    <tr><td>Nombre de mesures (N)</td><td id="res-n"></td></tr>
                    <tr><td>Moyenne (x̄)</td><td id="res-mean"></td></tr>
                    <tr><td>Écart Type (s)</td><td id="res-std-dev"></td></tr>
                    <tr><td>Valeur de t (calculée)</td><td id="res-t-value"></td></tr>
                    <tr><td>Écart |x̄ - xv|</td><td id="res-deviation"></td></tr>
                    <tr><td>Seuil de comparaison (t*s/√N)</td><td id="res-threshold"></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const studentTTable = {
            1:{90:6.314,95:12.706,98:31.821,99:63.657,99.9:636.619},2:{90:2.92,95:4.303,98:6.965,99:9.925,99.9:31.599},3:{90:2.353,95:3.182,98:4.541,99:5.841,99.9:12.924},4:{90:2.132,95:2.776,98:3.747,99:4.604,99.9:8.61},5:{90:2.015,95:2.571,98:3.365,99:4.032,99.9:6.869},6:{90:1.943,95:2.447,98:3.143,99:3.707,99.9:5.959},7:{90:1.895,95:2.365,98:2.998,99:3.499,99.9:5.408},8:{90:1.86,95:2.306,98:2.896,99:3.355,99.9:5.041},9:{90:1.833,95:2.262,98:2.821,99:3.25,99.9:4.781},10:{90:1.812,95:2.228,98:2.764,99:3.169,99.9:4.587},11:{90:1.796,95:2.201,98:2.718,99:3.106,99.9:4.437},12:{90:1.782,95:2.179,98:2.681,99:3.055,99.9:4.318},13:{90:1.771,95:2.16,98:2.65,99:3.012,99.9:4.221},14:{90:1.761,95:2.145,98:2.624,99:2.977,99.9:4.14},15:{90:1.753,95:2.131,98:2.602,99:2.947,99.9:4.073},16:{90:1.746,95:2.12,98:2.583,99:2.921,99.9:4.015},17:{90:1.74,95:2.11,98:2.567,99:2.898,99.9:3.965},18:{90:1.734,95:2.101,98:2.552,99:2.878,99.9:3.922},19:{90:1.729,95:2.093,98:2.539,99:2.861,99.9:3.883},20:{90:1.725,95:2.086,98:2.528,99:2.845,99.9:3.85},21:{90:1.721,95:2.08,98:2.518,99:2.831,99.9:3.819},22:{90:1.717,95:2.074,98:2.508,99:2.819,99.9:3.792},23:{90:1.714,95:2.069,98:2.5,99:2.807,99.9:3.768},24:{90:1.711,95:2.064,98:2.492,99:2.797,99.9:3.745},25:{90:1.708,95:2.06,98:2.485,99:2.787,99.9:3.725},26:{90:1.706,95:2.056,98:2.479,99:2.779,99.9:3.707},27:{90:1.703,95:2.052,98:2.473,99:2.771,99.9:3.69},28:{90:1.701,95:2.048,98:2.467,99:2.763,99.9:3.674},29:{90:1.699,95:2.045,98:2.462,99:2.756,99.9:3.659},30:{90:1.697,95:2.042,98:2.457,99:2.75,99.9:3.646}
        };

        function getTValue(df, confidence) {
            if (df < 1) return null;
            const ddlKey = Math.min(df, 30);
            return studentTTable[ddlKey] ? studentTTable[ddlKey][confidence] : null;
        }

        function calculateAndDisplay() {
            const trueValueStr = document.getElementById('true-value').value.trim();
            const confidenceLevel = document.getElementById('confidence-level').value;
            const expValuesStr = document.getElementById('exp-values').value.trim();

            if (!trueValueStr || !expValuesStr) {
                alert("Veuillez entrer la valeur vraie et la série expérimentale."); return;
            }

            const expValues = expValuesStr.replace(/[,;\s]+/g, '\n').split('\n').filter(v => v.trim() !== '').map(v => parseFloat(v.replace(',', '.')));
            const trueValue = parseFloat(trueValueStr.replace(',', '.'));
            
            if (isNaN(trueValue) || expValues.some(isNaN)) {
                alert("Saisie invalide. Assurez-vous que toutes les valeurs sont des nombres."); return;
            }

            const N = expValues.length;
            if (N < 2) {
                alert("Veuillez entrer au moins deux valeurs expérimentales."); return;
            }

            const df = N - 1;
            const tValue = getTValue(df, confidenceLevel);
            if (!tValue) {
                alert(`Impossible de trouver la valeur de t pour N=${N}.`); return;
            }

            const mean = expValues.reduce((a, b) => a + b, 0) / N;
            const variance = expValues.map(v => Math.pow(v - mean, 2)).reduce((a, b) => a + b, 0) / (N - 1);
            const stdDev = Math.sqrt(variance);
            const deviation = Math.abs(mean - trueValue);
            const threshold = tValue * stdDev / Math.sqrt(N);
            
            const conclusionEl = document.getElementById('conclusion-banner');
            if (deviation > threshold) {
                conclusionEl.innerHTML = `❌ Erreur systématique significative`;
                conclusionEl.className = "conclusion-error";
            } else {
                conclusionEl.innerHTML = `✅ Pas d'erreur systématique significative`;
                conclusionEl.className = "conclusion-ok";
            }
            
            document.getElementById('res-n').textContent = N;
            document.getElementById('res-mean').textContent = mean.toFixed(4);
            document.getElementById('res-std-dev').textContent = stdDev.toFixed(4);
            document.getElementById('res-t-value').textContent = `${tValue} (ddl=${df}, ${confidenceLevel}%)`;
            document.getElementById('res-deviation').textContent = deviation.toFixed(4);
            document.getElementById('res-threshold').textContent = threshold.toFixed(4);
            
            document.getElementById('results').style.display = 'block';
        }

        function resetApp() {
            document.getElementById('true-value').value = '';
            document.getElementById('exp-values').value = '';
            document.getElementById('confidence-level').value = '95';
            document.getElementById('results').style.display = 'none';
        }
    </script>

</body>
