    <div class="container">
        <h1>Concentration et Incertitude Élargie issues d'une courbe de calibration avec dilution</h1>

        <div class="input-group">
            <label for="C">Concentration C (mg/L) :</label>
            <input type="number" id="C" value="30.12">
        </div>
        <div class="input-group">
            <label for="u_C">Incertitude u(C) (mg/L) :</label>
            <input type="number" id="u_C" value="0.52">
        </div>
        <div class="input-group">
            <label for="V_pip">Volume Pipette (mL) :</label>
            <input type="number" id="V_pip" value="5">
        </div>
        <div class="input-group">
            <label for="t_pip">Tolérance Pipette (mL) :</label>
            <input type="number" id="t_pip" value="0.15">
        </div>
        <div class="input-group">
            <label for="V_fiole">Volume Fiole (mL) :</label>
            <input type="number" id="V_fiole" value="100">
        </div>
        <div class="input-group">
            <label for="t_fiole">Tolérance Fiole (mL) :</label>
            <input type="number" id="t_fiole" value="0.3">
        </div>
        <div class="input-group">
            <label for="temperature">Température (°C) :</label>
            <input type="number" id="temperature" value="20">
        </div>
        <button onclick="calculerIncertitude()">Calculer</button>
        
        <div class="result" id="result">Cesp = (0 ± 0) mg/L</div>
    </div>

    <script>
        function calculerIncertitude() {
            const C = parseFloat(document.getElementById('C').value);
            const u_C = parseFloat(document.getElementById('u_C').value);
            const V_pip = parseFloat(document.getElementById('V_pip').value);
            const t_pip = parseFloat(document.getElementById('t_pip').value);
            const V_fiole = parseFloat(document.getElementById('V_fiole').value);
            const t_fiole = parseFloat(document.getElementById('t_fiole').value);
            const temperature = parseFloat(document.getElementById('temperature').value);
            const reference_temperature = 20;
            const delta_theta = Math.abs(temperature - reference_temperature);
            const beta = 2.1e-4;
            const k = 2;

            const dilution_factor = V_fiole / V_pip;
            const C_esp = C * dilution_factor;
            
            const u_temp_pip = (beta * V_pip * Math.abs(delta_theta)) / Math.sqrt(3);
            const u_temp_fiole = (beta * V_fiole * Math.abs(delta_theta)) / Math.sqrt(3);
            const u_tol_pip = t_pip / Math.sqrt(6);
            const u_tol_fiole = t_fiole / Math.sqrt(6);
            
            const u_c = Math.sqrt(
                Math.pow(u_C / C, 2) +
                Math.pow(u_temp_pip / V_pip, 2) +
                Math.pow(u_temp_fiole / V_fiole, 2) +
                Math.pow(u_tol_pip / V_pip, 2) +
                Math.pow(u_tol_fiole / V_fiole, 2)
            ) * C_esp;
            
            const U = k * u_c;

            document.getElementById('result').textContent = `Cesp = (${C_esp.toFixed(1)} ± ${U.toFixed(1)}) mg/L (95%)`;
        }
    </script>
