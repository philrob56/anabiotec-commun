                    df_den = values2.length - 1;
                } else {
                    fCalculated = variance2 / variance1;
                    df_num = values2.length - 1;
                    df_den = values1.length - 1;
                }
                
                fCalculatedSpan.textContent = fCalculated.toFixed(3);

                // Recherche directe dans la table
                let fCritical = null;
                const tableForAlpha = fCriticalValues[alpha];
                if (tableForAlpha && tableForAlpha[df_num] && tableForAlpha[df_num][df_den]) {
                    fCritical = tableForAlpha[df_num][df_den];
                }

                if (fCritical) {
                    fCriticalSpan.textContent = fCritical.toFixed(3);
                    if (fCalculated > fCritical) {
                        resultSummary.textContent = "Les variances sont significativement différentes.";
                        resultSummary.className = 'variances-differentes';
                    } else {
                        resultSummary.textContent = "Les variances ne sont pas significativement différentes.";
                        resultSummary.className = 'variances-egales';
                    }
                } else {
                    resultSummary.textContent = `Valeurs critiques hors table (max mesures = 21).`;
                    resultSummary.className = 'info';
                    fCriticalSpan.textContent = "N/A";
                }
            };
            
            [container1, container2, alphaSelect].forEach(el => el.addEventListener('input', calculateFTest));
            [container1, container2].forEach(container => {
                 container.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowDown' && e.target.nodeName === 'INPUT') {
                        e.preventDefault();
                        addValueInput(container);
                    }
                });
            });
            
            clearButton.addEventListener('click', () => {
                container1.innerHTML = '<input type="number" placeholder="Valeur">';
                container2.innerHTML = '<input type="number" placeholder="Valeur">';
                container1.querySelector('input').focus();
                calculateFTest();
            });

            // Init
            calculateFTest();
        });
    </script>

</body>
</html>
